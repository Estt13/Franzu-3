<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quer ser a minha Rubi?</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <canvas id="ocean"></canvas>

    <!-- Elemento de Vídeo para Câmera -->
    <video id="camera-preview" autoplay playsinline muted></video>

    <!-- SVG da Água-viva -->
    <svg id="jellyfish" viewBox="0 0 100 150">
        <!-- Corpo/Campânula -->
        <path d="M10,50 C10,10 90,10 90,50 C90,60 10,60 10,50 Z" fill="#e0f2fe" opacity="0.85"/>
        <path d="M20,50 C20,25 80,25 80,50 Z" fill="#90e0ef" opacity="0.6"/>
        <!-- Tentáculos -->
        <path d="M25,55 Q20,80 30,110 T25,140" stroke="#00b4d8" stroke-width="3" fill="none" opacity="0.7"/>
        <path d="M40,58 Q48,85 38,115 T45,145" stroke="#90e0ef" stroke-width="4" fill="none" opacity="0.8"/>
        <path d="M50,58 Q52,90 60,120 T52,148" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.9"/>
        <path d="M60,58 Q52,85 62,115 T55,145" stroke="#90e0ef" stroke-width="4" fill="none" opacity="0.8"/>
        <path d="M75,55 Q80,80 70,110 T75,140" stroke="#00b4d8" stroke-width="3" fill="none" opacity="0.7"/>
    </svg>

    <div class="container">
        <h1 id="title">Quer ser a Rubi da minha safira?</h1>

        <div class="buttons-wrapper">
            <button id="btnSim" class="btn">Sim</button>
            <button id="btnNao" class="btn">Não</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
